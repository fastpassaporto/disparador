.container{

.top{

input[type=file]{

.card{

.card-header{

.card-left{

.expand{

.card.active .expand{

.card-title{

.badges{
display:flex;

.badge{

border:1px solid #2a3445;
font-size:11px;
font-weight:800;
color:#c5cede;
}

.dropdown{
display:none;
}

.card.active .dropdown{
display:block;
}

.table-header,.row{
display:grid;

align-items:center;
}

.table-header{
padding:14px 20px;
border-top:1px solid #1b2230;
border-bottom:1px solid #1b2230;
color:#75809a;
font-size:11px;
font-weight:800;
text-transform:uppercase;

.row{
padding:16px 20px;
border-bottom:1px solid #141923;
}

.name{
display:flex;
align-items:center;
gap:8px;
font-weight:800;

.dot{
width:8px;
height:8px;
border-radius:999px;

.green-dot{background:#3dffb5;}
.red-dot{background:#ff5f73;}
.yellow-dot{background:#ffcf5a;}

.sample{
font-size:10px;
color:#647089;
}

.hero{
font-size:15px;
font-weight:900;
}

.result{
width:max-content;
padding:5px 11px;
border-radius:999px;
font-size:10px;
font-weight:900;
border:1px solid;

.result.good{
color:#3dffb5;
border-color:rgba(61,255,181,.35);

}

.result.high{
color:#ff5f73;
border-color:rgba(255,95,115,.35);

}

.result.low{
color:#ffcf5a;

}

.target,.action{
font-weight:800;

let csvRows = [];

function normalize(v){

return String(v || '')
.replace(/"/g,'')
.replace(/\uFEFF/g,'')
.trim()
.toLowerCase();

}

function parseNumber(v){

if(!v) return 0;

return parseFloat(
String(v)
.replace(/"/g,'')
.replace('%','')
.replace(',','.')
.trim()
) || 0;

}

function getRow(position){

return csvRows.find(r => {

const positionKey =
Object.keys(r).find(k =>
normalize(k) === 'position'
);

if(!positionKey) return false;

return normalize(r[positionKey]) === normalize(position);

});

}

function getStat(position, stat){

const row = getRow(position);

if(!row) return 0;

const statKey =
Object.keys(row).find(k =>
normalize(k) === normalize(stat)
);

if(!statKey) return 0;

return parseNumber(row[statKey]);

}

function getHands(position){

const row = getRow(position);

if(!row) return 0;

const handsKey =
Object.keys(row).find(k =>
normalize(k) === 'hands'
);

if(!handsKey) return 0;

return row[handsKey];

}

function analyze(v,min,max,stat){

const map = ACTION_MAP[stat] || {
under:'Increase',
good:'Good Job',
over:'Decrease'
};

if(v < min){
return {
label:'LOW',
class:'low',
dot:'yellow-dot',
color:'yellow',
action:map.under
};
}

if(v > max){
return {
label:'HIGH',
class:'high',
dot:'red-dot',
color:'red',
action:map.over
};
}

return {
label:'GOOD',
class:'good',
dot:'green-dot',
color:'green',
action:map.good
};

}

document.getElementById('csvUpload')
.addEventListener('change', e => {

const file = e.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(ev){

const text = ev.target.result;

const lines =
text.split(/\r?\n/)
.filter(x => x.trim());

const headers =
lines[0]
.match(/(".*?"|[^",]+)(?=,|$)/g)
.map(h =>
h.replace(/"/g,'').trim()
);

csvRows =
lines.slice(1).map(line => {

const values =
line.match(/(".*?"|[^",]+)(?=,|$)/g) || [];

const obj = {};

headers.forEach((h,i) => {

obj[h] =
(values[i] || '')
.replace(/"/g,'')
.trim();

});

return obj;

});

const totalRow =
csvRows.find(r =>
normalize(r['Position']) === 'total'
);

if(totalRow){

document.getElementById('handsTotal')
.innerText =
totalRow['Hands'];

} else if(csvRows.length){

const lastRow =
csvRows[csvRows.length - 1];

const lastHandsKey =
Object.keys(lastRow).find(k =>
normalize(k) === 'hands'
);

if(lastHandsKey){

document.getElementById('handsTotal')
.innerText =
lastRow[lastHandsKey];

}

}

document.getElementById('statusText')
.innerText =
'CSV Loaded Successfully';

render();

};

reader.readAsText(file);

});

render();

</script>
